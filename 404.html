<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — Luxe Voyages. Return to our luxury travel homepage.">
  <title>404 — Page Not Found | Luxe Voyages</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/rtl.css">
  <style>
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--color-bg-primary);
      overflow: hidden;
      position: relative;
    }

    /* Ambient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(212,175,55,0.12) 0%, transparent 70%);
      top: -200px; right: -100px;
    }
    .orb-2 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(6,95,70,0.10) 0%, transparent 70%);
      bottom: -200px; left: -100px;
    }
    .orb-3 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(11,31,58,0.15) 0%, transparent 70%);
      top: 50%; left: 50%; transform: translate(-50%,-50%);
    }

    .error-page {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: var(--space-8) var(--space-6);
      max-width: 680px;
      animation: fadeInUp 0.8s ease both;
    }

    .error-404 {
      font-family: var(--font-display);
      font-size: clamp(7rem, 18vw, 14rem);
      font-weight: 700;
      line-height: 1;
      color: transparent;
      background-image: url('https://loremflickr.com/800/600/luxury,travel?random=101') 0%, var(--color-bronze) 50%, var(--color-midnight) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      margin-bottom: var(--space-2);
      letter-spacing: -0.02em;
      animation: shimmer 3s ease-in-out infinite alternate;
    }

    @keyframes shimmer {
      from { filter: brightness(1); }
      to   { filter: brightness(1.15); }
    }

    .error-compass {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-6);
      animation: spin 12s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      color: var(--color-text-primary);
      margin-bottom: var(--space-4);
    }

    .error-desc {
      font-size: var(--fs-body);
      color: var(--color-text-secondary);
      max-width: 440px;
      margin: 0 auto var(--space-8);
      line-height: 1.7;
    }

    .error-actions {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: var(--space-10);
    }

    .error-links-title {
      font-size: var(--fs-body-sm);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text-tertiary);
      margin-bottom: var(--space-4);
    }

    .error-links {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-link {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      font-size: var(--fs-body-sm);
      color: var(--color-text-secondary);
      text-decoration: none;
      transition: all var(--transition-base);
      background: var(--color-bg-card);
    }
    .error-link:hover {
      border-color: var(--color-gold);
      color: var(--color-gold);
      transform: translateY(-2px);
    }

    .theme-btn {
      position: fixed;
      top: var(--space-4);
      inset-inline-end: var(--space-4);
    }
    .logo-link {
      position: fixed;
      top: var(--space-4);
      inset-inline-start: var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      text-decoration: none;
    }
    .logo-link span {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--color-text-primary);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Top logo -->
  <a href="index.html" class="logo-link" aria-label="Luxe Voyages Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-gold)" stroke-width="1.5" width="28" height="28">
      <circle cx="12" cy="12" r="10"/>
      <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="var(--color-gold)" stroke="none"/>
    </svg>
    <span>Luxe Voyages</span>
  </a>

  <!-- Theme toggle -->
  <div class="theme-btn">
    <button class="navbar__toggle-btn" data-theme-toggle aria-label="Toggle dark mode">
      <span class="icon-sun" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </span>
      <span class="icon-moon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </span>
    </button>
  </div>

  <!-- Main error content -->
  <div class="error-page" role="main">
    <!-- Compass icon -->
    <div class="error-compass" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-gold)" stroke-width="1" width="64" height="64">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="var(--color-gold)" stroke="none" opacity="0.7"/>
      </svg>
    </div>

    <div class="error-404" aria-label="404">404</div>

    <h1 class="error-title">This Destination Doesn't Exist</h1>
    <p class="error-desc">
      Looks like your compass led you somewhere unexplored. The page you're looking for may have moved, been renamed, or simply vanished into the horizon.
    </p>

    <div class="error-actions">
      <a href="index.html" class="btn btn--primary btn--lg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="margin-inline-end:8px"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Return Home
      </a>
      <a href="contact.html" class="btn btn--outline btn--lg">Contact Support</a>
    </div>

    <div class="error-links-title">Popular Destinations</div>
    <div class="error-links">
      <a href="services.html" class="error-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
        Our Services
      </a>
      <a href="about.html" class="error-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        About Us
      </a>
      <a href="blog.html" class="error-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Travel Blog
      </a>
      <a href="contact.html" class="error-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Contact
      </a>
      <a href="sitemap.html" class="error-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Sitemap
      </a>
    </div>
  </div>

  <script>
    const saved = localStorage.getItem('luxe-travel-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    document.querySelectorAll('[data-theme-toggle]').forEach(btn => {
      const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
      const sync = () => {
        btn.querySelector('.icon-sun').style.display = isDark() ? 'block' : 'none';
        btn.querySelector('.icon-moon').style.display = isDark() ? 'none' : 'block';
      };
      sync();
      btn.addEventListener('click', () => {
        const next = isDark() ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('luxe-travel-theme', next);
        sync();
      });
    });
  </script>
</body>
</html>
